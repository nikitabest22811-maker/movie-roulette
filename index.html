<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎬 Кино-Рулетка</title>
  
  <!-- Подключаем кинематографичные шрифты -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Обновили версию CSS до v=3 -->
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div class="container">
    <h1>🎬 Кино-Рулетка</h1>
    <p class="subtitle">Не знаешь, что посмотреть? Доверься случаю!</p>
    
    <div class="controls">
      <!-- Добавили новые жанры -->
      <select id="genreSelect" class="genre-select">
        <option value="">Любой жанр</option>
        <option value="action">Боевик</option>
        <option value="comedy">Комедия</option>
        <option value="horror">Ужасы</option>
        <option value="sci-fi">Фантастика</option>
        <option value="drama">Драма</option>
        <option value="thriller">Триллер</option>
        <option value="animation">Мультфильм</option>
        <option value="documentary">Документальное</option>
        <option value="family">Семейное</option>
        <option value="romance">Мелодрама</option>
      </select>
      <button id="spinBtn" class="spin-btn">Крутить рулетку</button>
    </div>

    <!-- Скелетон загрузки -->
    <div id="skeletonCard" class="movie-card skeleton hidden">
      <div class="poster-container">
        <div class="poster skeleton-box"></div>
      </div>
      <div class="movie-info">
        <div class="skeleton-line skeleton-title"></div>
        <div class="skeleton-line skeleton-meta"></div>
        <div class="skeleton-line skeleton-plot"></div>
        <div class="skeleton-line skeleton-plot"></div>
      </div>
    </div>

    <!-- Основная карточка фильма -->
    <div id="movieCard" class="movie-card hidden">
      <div class="poster-container">
        <img id="moviePoster" src="" alt="Постер" class="poster">
        <button id="favBtn" class="fav-btn">🤍 В избранное</button>
      </div>
      <div class="movie-info">
        <h2 id="movieTitle"></h2>
        <div class="meta">
          <p id="movieYear" class="year"></p>
          <p id="movieRating" class="rating">⭐ N/A</p>
        </div>
        <p id="moviePlot" class="plot"></p>
        <div class="action-buttons">
          <a id="trailerBtn" href="#" class="btn-primary hidden">▶ Смотреть трейлер</a>
          <button id="skipBtn" class="btn-secondary">⏭ Пропустить</button>
        </div>
      </div>
    </div>

    <!-- Секция избранного -->
    <div class="favorites-section">
      <h3>Мой список "Посмотреть"</h3>
      <div id="favoritesList" class="favorites-list">
        <p class="empty-msg">Список пока пуст...</p>
      </div>
    </div>
  </div>

  <!-- Модальное окно для трейлера -->
  <div id="trailerModal" class="modal-overlay" style="display: none;">
    <div class="modal-content trailer-modal">
      <button id="closeTrailerBtn" class="close-modal-btn">✕</button>
      <div id="trailerContainer"></div>
    </div>
  </div>

  <!-- Обновили версию скрипта до v=3 -->
  <script src="script.js?v=3"></script>
</body>
</html>
